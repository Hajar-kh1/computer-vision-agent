# Docker Compose — full stack (spec §25, §27, §29)
# Services: postgres, backend, frontend, open-webui
# Containers talk to each other using Docker service names (e.g. postgres:5432),
# never localhost.

services:

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: cvapp
      POSTGRES_USER: cvuser
      POSTGRES_PASSWORD: cvpassword   # TODO: use a strong production password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # TODO: add healthcheck (pg_isready) so backend waits for a ready DB
    # Do NOT publish ports to the host in production (spec §34: don't expose PostgreSQL publicly).

  backend:
    build:
      context: .            # repo root — pyproject.toml + uv.lock live here
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://cvuser:cvpassword@postgres:5432/cvapp
      MODEL_PATH: /app/models/model.pt
      MODEL_VERSION: "1.0.0"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-https://cloud.langfuse.com}
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "3000:80"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      # Point Open WebUI at your LLM provider here (spec §20)
      OPENAI_API_BASE_URL: ${LLM_BASE_URL:-}
      OPENAI_API_KEY: ${LLM_API_KEY:-}
      # Auto-create the admin account on first boot (no manual signup)
      WEBUI_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      WEBUI_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
    volumes:
      - open_webui_data:/app/backend/data
    ports:
      - "8080:8080"

  # One-shot seeder: configures the Open WebUI connection, tool and model
  # from env + the repo files, so a fresh clone needs zero UI setup.
  open-webui-init:
    image: ghcr.io/open-webui/open-webui:main
    entrypoint: ["python", "/app/openwebui-seed/seed_openwebui.py"]
    volumes:
      - open_webui_data:/app/backend/data
      - ./openwebui:/app/openwebui-seed:ro
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
    depends_on:
      open-webui:
        condition: service_healthy
    restart: "no"

  # Optional self-hosted LangFuse (LLM observability) — no account needed.
  # Enable with: docker compose --profile langfuse up -d
  # Then set LANGFUSE_HOST=http://langfuse:3000 in .env (UI at localhost:3001).
  langfuse:
    image: ghcr.io/langfuse/langfuse:latest
    profiles: ["langfuse"]
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_URL: http://localhost:3001
      NEXTAUTH_SECRET: 6fa1c38274e1835ba1bfce0c90e88a3c   # dev only — change in prod
      SALT: x+fuSe46NGPoQ5hTtp8QRAo/8yUuIsYv9uvqrCi3ga0=  # dev only
      ENCRYPTION_KEY: 5Q4XcE5VKWjGsGigpcDjghxmDHXfId5Nr/W0QmsW6wc=  # dev only
      LANGFUSE_CREATE_PROJECT_ON_FIRST_USER: "true"
    ports:
      - "3001:3000"
    depends_on:
      - langfuse-postgres

  langfuse-postgres:
    image: postgres:16
    profiles: ["langfuse"]
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    volumes:
      - langfuse_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  open_webui_data:
  langfuse_data:
