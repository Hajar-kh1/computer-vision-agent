# nginx config for the frontend container.
# - Serves the built React app (SPA fallback to index.html).
# - Proxies /api and /health to the backend container (Docker service name,
#   spec §29 — containers talk to each other by service name, never localhost).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side routing needs index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy -> backend:8000 (keeps the browser on one origin, no CORS).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;          # first (cold) inference can be slow
        client_max_body_size 15m;         # uploads up to the backend's 10MB cap
    }

    # Health check used by the frontend status pill.
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }
}
